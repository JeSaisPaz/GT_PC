// PERFORMANCE PATCHES
// ═══════════════════════════════════════════════════════════════════════════

_C0 Max CPU Clock (333MHz)
// Forces the PSP CPU to run at maximum speed.
// On PPSSPP, this is typically handled by settings, but this cheat
// ensures the game code requests 333MHz explicitly.
// Address: This may not be needed in PPSSPP; use the emulator's
// "Change PSP CPU clock (inaccurate)" setting instead.
_L 0x80000000 0x00000000
// Note: 0x88000000 is a placeholder. In PPSSPP, the clock speed
// is better handled via: Settings → System → PSP CPU Clock → 333MHz


_C0 UMD Speed Unlock [NEEDS ADDR]
// Removes UMD read speed throttling by NOP-ing the delay loop.
// This reduces loading times.
// TODO: Find sceUmdWaitDriveStat call and NOP it
// _L 0x08XXXXXX 0x00000000


