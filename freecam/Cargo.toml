[package]
name = "gt-freecam"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "29"
winit = "0.30"
env_logger = "0.11"
log = "0.4"
anyhow = "1.0"
thiserror = "1.0"
glam = "0.26"
image = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
bytemuck = "1.16"
pollster = "0.3"

[target.'cfg(windows)'.build-dependencies]
bindgen = "0.69"

[profile.release]
opt-level = 3
lto = true